---
name: 'Quality Checks'

on: [pull_request]

permissions:
  contents: read

jobs:
  quality-checks:
    name: 'Linters'
    # yamllint disable-line rule:line-length
    uses: garretpatten/quality-checks/.github/workflows/quality-checks.yaml@78294799f20fc78703fe62488a7d11a6903214b5  # v2

  psscriptanalyzer:
    name: 'PSScriptAnalyzer'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: >
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          -SkipPublisherCheck

      - name: Run PSScriptAnalyzer on changed files
        shell: pwsh
        run: ./scripts/check-pssa.ps1
